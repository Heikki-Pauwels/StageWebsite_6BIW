<!DOCTYPE html>
<html lang="nl-BE">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact  - Stage GZBK</title>
    <!-- link met het externe CSS-->
    <link rel="stylesheet" href="opmaak.css">
    <!-- link met het externe JS-->
    <script src="contact.js"></script>
</head>

<body>
    <!-- Titelbalk van de pagina -->
    <header>
        <h1>Contact</h1>
    </header>

    <!-- Navigatiemenu -->
    <div id="navDiv">
        <nav>
            <ul>
                <li>
                    <a href="index.html">HOME</a>
                </li>
                <li>
                    <a href="algemeneGegevens.html">GEGEVENS</a>
                </li>
                <li>
                    <a href="contact.html">CONTACT</a>
                </li>
                <li>
                    <a href="logboek.html">LOGBOEK</a>
                </li>
            </ul>
        </nav>
    </div>

    <!-- Hoofdinhoud met kolomen-->
    <div class="row">
        <!-- Linkerkolom: Contactgegevens van de organisatie -->
        <div class="col-3">
            <h2>Contact</h2>
            <img src="images/contacticon.png" alt="Contacticoon" id="contactIcon">
            <ul id="contactUl">
                <li>
                    Langemarkstraat 8
                </li>
                <li>
                    8980 Zonnebeke
                </li>
                <li>
                    <a href="tel:+3251480060">Tel: +32 51 48 00 60</a>
                </li>
                <li>
                    <a href="mailto:info@zonnebeke.be">E-mail: info@zonnebeke.be</a>
                </li>
            </ul>
        </div>

        <!-- Rechterkolom: Inhoud met het contactformulier -->
        <div class="col-9">
            <main>
                <section>
                    <!-- Contactformulier -->
                    <form>
                        <!-- Formuliersectie 1: Persoonlijke gegevens -->
                        <fieldset>
                            <legend>Basisgegevens</legend>
                            <label for="vNaam">Voornaam <b class="requiredstar">*</b></label>
                            <input type="text" id="vNaam" name="vNaam" required>

                            <label for="fNaam">Familienaam <b class="requiredstar">*</b></label>
                            <input type="text" id="fNaam" name="fNaam" required>

                            <label for="email">E-mail <b class="requiredstar">*</b></label>
                            <input type="email" id="email" name="email" required>

                            <label for="telefoonNummer">Telefoonnummer</label>
                            <input type="tel" id="telefoonNummer" name="telefoonNummer">
                        </fieldset>

                        <!-- Formuliersectie 2: Adresgegevens -->
                        <fieldset>
                            <legend>Woonplaats</legend>
                            <label for="straatNaam">Straatnaam</label>
                            <input type="text" id="straatNaam" name="straatNaam">

                            <label for="postcode">Postcode <b class="requiredstar">*</b></label>
                            <input type="number" id="postcode" name="postcode" min="0" max="9999" required>
                        </fieldset>

                        <!-- Formuliersectie 3: Het eigenlijke bericht -->
                        <fieldset>
                            <legend>Bericht <b class="requiredstar">*</b></legend>
                            <textarea name="bericht" id="bericht" required></textarea>
                        </fieldset>

                        <!-- Verzendknop -->
                        <br><input type="submit" value="Verzenden" id="submit">
                    </form>
                </section>
            </main>
        </div>
    </div>

    <!-- Voettekst met copyright -->
    <footer>
        <p>&copy; Heikki Pauwels</p>
    </footer>
</body>
</html>
